# Deploy user + admin Vite apps to Vercel (two separate Vercel projects).
# Required repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_USER, VERCEL_PROJECT_ID_ADMIN
# How to set them: docs/HOSTING_VERCEL.md → "GitHub Actions (token deploy)"
# VITE_API_URL and VITE_ADMIN_API belong in each Vercel project (not in GitHub).
# Run from repo root (.) so Vercel “Root Directory” in each project (e.g. user-mode/client) is
# not doubled with working-directory in this workflow.

name: Deploy frontends to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "user-mode/client/**"
      - "admin-mode/client/**"
      - ".github/workflows/deploy-vercel-frontends.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel GitHub secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_USER: ${{ secrets.VERCEL_PROJECT_ID_USER }}
          VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        run: |
          ok=0
          need() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::Repository secret $name is missing or empty. Add it under Settings → Secrets and variables → Actions. See docs/HOSTING_VERCEL.md (section 7.1 GitHub Actions token deploy)."
              ok=1
            fi
          }
          need VERCEL_TOKEN "$VERCEL_TOKEN"
          need VERCEL_ORG_ID "$VERCEL_ORG_ID"
          need VERCEL_PROJECT_ID_USER "$VERCEL_PROJECT_ID_USER"
          need VERCEL_PROJECT_ID_ADMIN "$VERCEL_PROJECT_ID_ADMIN"
          exit $ok

  deploy-user:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy user site to Vercel
        uses: amondnet/vercel-action@v25
        with:
          # amondnet/vercel-action defaults to vercel@25; Vercel’s API requires a current CLI (see npm "vercel" package, e.g. 52+).
          vercel-version: 52.0.0
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_USER }}
          working-directory: .
          vercel-args: "--prod"

  deploy-admin:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy admin site to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-version: 52.0.0
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          working-directory: .
          vercel-args: "--prod"
